<template id="song-template">
  <div data-composition-id="song" data-width="1080" data-height="1920" data-duration="42">
    <div style="position:absolute;inset:0;background:#000;z-index:0;"></div>
    <audio id="bg-audio" src="../assets/audio.mp3" data-start="0" data-duration="42"></audio>
    <div id="watermark">waxthink.com</div>
    <div class="block" id="bintro">
      <div class="intro-artist">2PAC</div>
      <div class="intro-rule" id="intro-rule"></div>
      <div class="intro-title">Changes</div>
      <div class="intro-meta">1998&nbsp;&nbsp;&middot;&nbsp;&nbsp;prod. QDIII</div>
    </div>

    <div class="block" id="b1">
      <div class="en">I see no changes, wake up in the morning and I ask myself<br>
          Is life worth livin'? Should I blast myself?</div>
      <div class="sep"></div>
      <div class="jp">変化が見えない、朝起きて自問する<br>
          人生は生きる価値があるか？自分を撃つべきか？</div>
    </div>

    <div class="block" id="b2">
      <div class="en">I'm tired of bein' poor and, even worse, I'm black<br>
          My stomach hurts so I'm lookin' for a purse to snatch</div>
      <div class="sep"></div>
      <div class="jp">貧乏にうんざりしてる、さらに最悪なのは俺が黒人だということ<br>
          腹が減って、ひったくりするバッグを探してる</div>
    </div>

    <div class="block" id="b3">
      <div class="en">Cops give a damn about a negro<br>
          Pull the trigger, kill a n***a, he's a hero</div>
      <div class="sep"></div>
      <div class="jp">警官は黒人のことなんか気にもしない<br>
          引き金を引いて、n***aを殺せばヒーローだ</div>
    </div>

    <div class="block" id="b4">
      <div class="en">"Give the crack to the kids, who the hell cares?<br>
          One less hungry mouth on the welfare"</div>
      <div class="sep"></div>
      <div class="jp">「子供にクラックを与えろ、誰が気にする？<br>
          生活保護で食わせる口が一つ減る」</div>
    </div>

    <div class="block" id="b5">
      <div class="en">First ship 'em dope and let 'em deal to brothers<br>
          Give 'em guns, step back, watch 'em kill each other</div>
      <div class="sep"></div>
      <div class="jp">まずドープを送り込んで、仲間に売らせる<br>
          銃を与えて、引いて、お互い殺し合うのを見る</div>
    </div>

    <div class="block" id="b6">
      <div class="en">How can the Devil take a brother if he's close to me?<br>
          I'd love to go back to when we played as kids</div>
      <div class="sep"></div>
      <div class="jp">俺のそばにいれば、悪魔はどうやって兄弟を連れ去れる？<br>
          子供として遊んでいた頃に戻りたい</div>
    </div>

    <div class="block" id="b7">
      <div class="en">I got love for my brother<br>
          But we can never go nowhere unless we share with each other<br>
          We gotta start makin' changes</div>
      <div class="sep"></div>
      <div class="jp">俺は兄弟たちを愛してる<br>
          でも互いに分かち合わない限り、どこにも行けない<br>
          変化を起こし始めないといけない</div>
    </div>

    <div class="block" id="b8">
      <div class="en">Learn to see me as a brother instead of two distant strangers<br>
          And that's how it's supposed to be</div>
      <div class="sep"></div>
      <div class="jp">俺を見知らぬ他人ではなく、兄弟として見ることを学んでくれ<br>
          それが本来あるべき姿だ</div>
    </div>

    <div class="block" id="bcta">
      <div class="bcta-rule"></div>
      <div class="bcta-brand">WAX&amp;THINK</div>
      <div class="bcta-url">waxthink.com</div>
    </div>
    <div id="meta-bar">
      <div class="meta-artist">2PAC</div>
      <div class="meta-title-group"><div class="meta-title">Changes</div><div class="meta-rule"></div></div>
      <div class="meta-info">1998&nbsp;&nbsp;&middot;&nbsp;&nbsp;QDIII</div>
    </div>
    <div id="fadeout" style="position:absolute;inset:0;background:#000;opacity:0;z-index:20;pointer-events:none;"></div>
    <style>
      [data-composition-id="song"]{background:#000;font-family:"Inter",sans-serif;color:#fff;overflow:hidden;}
      .intro-artist{font-size:200px;font-weight:900;letter-spacing:-0.04em;line-height:1;color:#fff;}
      .intro-rule{width:0;height:3px;background:#c8a96b;margin:32px 0 28px;}
      .intro-title{font-size:54px;font-weight:400;color:#999;}
      .intro-meta{font-size:22px;letter-spacing:0.22em;color:#444;margin-top:18px;text-transform:uppercase;}
      #watermark{position:absolute;bottom:90px;left:0;right:0;text-align:center;font-size:22px;font-weight:700;color:#333;letter-spacing:0.05em;z-index:10;}
      #meta-bar{position:absolute;bottom:210px;left:0;right:0;display:flex;flex-direction:column;align-items:center;z-index:10;}
      .meta-artist{font-size:36px;font-weight:900;color:#fff;letter-spacing:-0.02em;line-height:1;}
      .meta-title{font-size:34px;font-weight:400;color:#888;letter-spacing:0.02em;margin-top:5px;white-space:nowrap;}
      .meta-title-group{display:inline-block;}
      .meta-rule{width:100%;height:2px;background:#c8a96b;margin:10px 0;}
      .meta-info{font-size:24px;font-weight:400;color:#444;letter-spacing:0.1em;text-transform:uppercase;}
      .block{position:absolute;top:50%;left:90px;right:90px;transform:translateY(-50%);display:flex;flex-direction:column;align-items:flex-start;opacity:0;}
      #bintro{top:770px;transform:none;}
      .en{font-size:72px;font-weight:900;color:#fff;line-height:1.08;letter-spacing:-0.02em;}
      .sep{width:48px;height:2px;background:#c8a96b;margin:24px 0;flex-shrink:0;}
      .jp{font-family:"Noto Sans JP",sans-serif;font-size:46px;font-weight:700;color:#c8a96b;line-height:1.45;}
      #bcta{z-index:25;align-items:center;}
      .bcta-rule{width:48px;height:2px;background:#c8a96b;margin-bottom:32px;}
      .bcta-brand{font-size:120px;font-weight:900;color:#fff;letter-spacing:-0.04em;line-height:1;}
      .bcta-url{font-size:26px;font-weight:400;color:#555;letter-spacing:0.18em;margin-top:20px;}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      const tl = gsap.timeline({paused:true});
      tl.set(".block",{opacity:0},0);
      tl.set(".intro-rule",{width:0},0);
      tl.set("#meta-bar",{opacity:0},0);
      tl.fromTo("#bintro",{opacity:0,scale:0.95,transformOrigin:"center top"},{opacity:1,scale:1,duration:0.6,ease:"expo.out"},0.1);
      tl.to(".intro-rule",{width:120,duration:0.5,ease:"expo.out"},0.5);
      tl.to("#bintro",{scale:0.13,y:1000,transformOrigin:"center top",duration:0.7,ease:"expo.in"},2.0);
      tl.to("#bintro",{opacity:0,duration:0.3,ease:"power2.in"},2.5);
      tl.set("#bintro",{opacity:0},2.8);
      tl.fromTo("#meta-bar",{opacity:0},{opacity:1,duration:0.4,ease:"power2.out"},2.5);
      function show(id,t,t2){
        tl.fromTo(id,{opacity:0,y:20},{opacity:1,y:0,duration:0.3,ease:"power2.out"},t);
        if(t2){tl.to(id,{opacity:0,duration:0.2,ease:"power2.in"},t2-0.2);tl.set(id,{opacity:0},t2);}
      }
      show("#b1", 2.30, 5.54);
      show("#b2", 5.54, 9.57);
      show("#b3", 9.57, 13.88);
      show("#b4", 13.88, 18.35);
      show("#b5", 18.35, 22.59);
      show("#b6", 22.59, 26.89);
      show("#b7", 26.89, 31.70);
      tl.fromTo("#b8", {opacity:0}, {opacity:1, duration:0.3, ease:"power2.out"}, 31.70);
      tl.to("#b8", {opacity:0, duration:2.0, ease:"power2.in"}, 33.40);
      tl.to("#fadeout",{opacity:1,duration:1.2,ease:"power2.in"},36.5);
      tl.set("#fadeout",{opacity:1},42);
      tl.fromTo("#bcta",{opacity:0},{opacity:1,duration:0.8,ease:"power1.out"},37.5);
      window.__timelines=window.__timelines||{};
      window.__timelines["song"]=tl;
    </script>
  </div>
</template>
