<template id="song-template">
  <div
    data-composition-id="song"
    data-width="1080"
    data-height="1920"
    data-duration="42"
  >
    <div style="position:absolute;inset:0;background:#000;z-index:0;"></div>
    <audio id="bg-audio" src="../assets/audio.mp3" data-start="0" data-duration="42"></audio>

    <div id="watermark">waxthink.com</div>

    <!-- INTRO (0–2.3s) -->
    <div class="block" id="bintro">
      <div class="intro-artist">NAS</div>
      <div class="intro-rule" id="intro-rule"></div>
      <div class="intro-title">If I Ruled the World</div>
      <div class="intro-meta">1996&#160;&#160;·&#160;&#160;TRACKMASTERS</div>
    </div>

    <!-- Block 1: VTT 53.73 - 53 = 0.73s -->
    <div class="block" id="b1">
      <div class="en">Imagine smokin' weed in the streets<br>without cops harassin'</div>
      <div class="sep"></div>
      <div class="jp">警官に邪魔されずに<br>路上でマリファナを吸う想像をしろ</div>
    </div>

    <!-- Block 2: VTT 56.648 - 53 = 3.64s -->
    <div class="block" id="b2">
      <div class="en">Imagine going to court with no trial</div>
      <div class="sep"></div>
      <div class="jp">裁判なしに法廷へ行く想像をしろ</div>
    </div>

    <!-- Block 3: VTT 58.585 - 53 = 5.58s -->
    <div class="block" id="b3">
      <div class="en">Lifestyle cruisin' blue behind my waters</div>
      <div class="sep"></div>
      <div class="jp">水面を青く滑る<br>クルーズのライフスタイル</div>
    </div>

    <!-- Block 4: VTT 60.55 - 53 = 7.55s -->
    <div class="block" id="b4">
      <div class="en">No welfare supporters,<br>more conscious of the way we raise our daughters</div>
      <div class="sep"></div>
      <div class="jp">生活保護に頼らず<br>娘の育て方をもっと意識する</div>
    </div>

    <!-- Block 5: VTT 63.949 - 53 = 10.94s -->
    <div class="block" id="b5">
      <div class="en">Days are shorter, nights are colder</div>
      <div class="sep"></div>
      <div class="jp">日は短く、夜は冷える</div>
    </div>

    <!-- Block 6: VTT 65.811 - 53 = 12.81s -->
    <div class="block" id="b6">
      <div class="en">Feelin' like life is over,<br>these snakes strike like a cobra</div>
      <div class="sep"></div>
      <div class="jp">人生が終わるような感覚<br>蛇どもがコブラのように噛みつく</div>
    </div>

    <!-- Block 7: VTT 69.048 - 53 = 16.04s -->
    <div class="block" id="b7">
      <div class="en">The world's hot, my son got not,<br>evidently it's elementary</div>
      <div class="sep"></div>
      <div class="jp">世界は燃えている、息子は何も持っていない<br>明らかにこれが現実だ</div>
    </div>

    <!-- Block 8: VTT 72.474 - 53 = 19.47s -->
    <div class="block" id="b8">
      <div class="en">They want us all gone eventually</div>
      <div class="sep"></div>
      <div class="jp">奴らはいずれ俺たちを<br>全員消し去りたいんだ</div>
    </div>

    <!-- Block 9: VTT 76.488 - 53 = 23.48s -->
    <div class="block" id="b9">
      <div class="en">Trooping out of state for a plate, knowledge</div>
      <div class="sep"></div>
      <div class="jp">飯と知識を求めて<br>州を越えて行軍する</div>
    </div>

    <!-- CTA (最後の歌詞後) -->
    <div class="block" id="bcta">
      <div class="cta-sub">全歌詞・完全翻訳はこちら</div>
      <div class="cta-url">waxthink.com</div>
    </div>

    <!-- Persistent metadata (always visible, center-bottom) -->
    <div id="meta-bar">
      <div class="meta-artist">NAS</div>
      <div class="meta-title-group">
        <div class="meta-title">If I Ruled the World</div>
        <div class="meta-rule"></div>
      </div>
      <div class="meta-info">1996&#160;&#160;·&#160;&#160;TRACKMASTERS</div>
    </div>

    <!-- Full-screen fadeout overlay -->
    <div id="fadeout" style="position:absolute;inset:0;background:#000;opacity:0;z-index:20;pointer-events:none;"></div>

    <style>
      [data-composition-id="song"] {
        background: #000;
        font-family: 'Inter', sans-serif;
        color: #fff;
        overflow: hidden;
      }

      .intro-artist {
        font-size: 200px;
        font-weight: 900;
        letter-spacing: -0.04em;
        line-height: 1;
        color: #fff;
      }
      .intro-rule {
        width: 0;
        height: 3px;
        background: #c8a96b;
        margin: 32px 0 28px;
      }
      .intro-title {
        font-size: 54px;
        font-weight: 400;
        color: #999;
      }
      .intro-meta {
        font-size: 22px;
        letter-spacing: 0.22em;
        color: #444;
        margin-top: 18px;
        text-transform: uppercase;
      }

      #watermark {
        position: absolute;
        bottom: 90px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 22px;
        font-weight: 700;
        color: #333;
        letter-spacing: 0.05em;
        z-index: 10;
      }

      #meta-bar {
        position: absolute;
        bottom: 210px;
        left: 0;
        right: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        z-index: 10;
      }
      .meta-artist {
        font-size: 36px;
        font-weight: 900;
        color: #fff;
        letter-spacing: -0.02em;
        line-height: 1;
      }
      .meta-title {
        font-size: 34px;
        font-weight: 400;
        color: #888;
        letter-spacing: 0.02em;
        margin-top: 5px;
        white-space: nowrap;
      }
      .meta-title-group {
        display: inline-block;
      }
      .meta-rule {
        width: 100%;
        height: 2px;
        background: #c8a96b;
        margin: 10px 0;
      }
      .meta-info {
        font-size: 24px;
        font-weight: 400;
        color: #444;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .block {
        position: absolute;
        top: 50%;
        left: 90px;
        right: 90px;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        opacity: 0;
      }

      /* bintro uses explicit top so GSAP can animate scale/y freely */
      #bintro {
        top: 770px;
        transform: none;
      }

      .en {
        font-size: 72px;
        font-weight: 900;
        color: #fff;
        line-height: 1.08;
        letter-spacing: -0.02em;
      }
      .sep {
        width: 48px;
        height: 2px;
        background: #c8a96b;
        margin: 24px 0;
        flex-shrink: 0;
      }
      .jp {
        font-family: 'Noto Sans JP', sans-serif;
        font-size: 46px;
        font-weight: 700;
        color: #c8a96b;
        line-height: 1.45;
      }

      .cta-sub {
        font-family: 'Noto Sans JP', sans-serif;
        font-size: 38px;
        font-weight: 400;
        color: #888;
        letter-spacing: 0.05em;
      }
      .cta-url {
        font-size: 96px;
        font-weight: 900;
        color: #fff;
        letter-spacing: -0.03em;
        margin-top: 20px;
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      const tl = gsap.timeline({ paused: true });

      tl.set(".block", { opacity: 0 }, 0);
      tl.set(".intro-rule", { width: 0 }, 0);
      tl.set("#meta-bar", { opacity: 0 }, 0);

      // ── Intro (0–2.3s) ───────────────────────────────────────
      tl.fromTo("#bintro",
        { opacity: 0, scale: 0.95, transformOrigin: "center top" },
        { opacity: 1, scale: 1, duration: 0.6, ease: "expo.out" }, 0.1);
      tl.to(".intro-rule", { width: 120, duration: 0.5, ease: "expo.out" }, 0.5);

      // ── Shrink + move to bottom-center (2.0–2.7s) ────────────
      tl.to("#bintro", {
        scale: 0.13,
        y: 1000,
        transformOrigin: "center top",
        duration: 0.7,
        ease: "expo.in"
      }, 2.0);
      tl.to("#bintro", { opacity: 0, duration: 0.3, ease: "power2.in" }, 2.5);
      tl.set("#bintro", { opacity: 0 }, 2.8);

      tl.fromTo("#meta-bar",
        { opacity: 0 },
        { opacity: 1, duration: 0.4, ease: "power2.out" }, 2.5);

      // ── Lyric blocks ─────────────────────────────────────────
      // タイミング = VTT秒 - VERSE_START（ffmpegの-ssオフセット）
      // 例: VTTが20.3sでVERSE_START=18なら → show("#b1", 2.3, 次の行のVTT-18)
      function show(id, t, t2) {
        tl.fromTo(id,
          { opacity: 0, y: 20 },
          { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, t);
        if (t2) {
          tl.to(id, { opacity: 0, duration: 0.2, ease: "power2.in" }, t2 - 0.2);
          tl.set(id, { opacity: 0 }, t2);
        }
      }

      // VTT timestamps minus VERSE_START=53
      // Note: VTT is from a different video; slight timing offset possible
      show("#b1",  0.73,  3.64);
      show("#b2",  3.64,  5.58);
      show("#b3",  5.58,  7.55);
      show("#b4",  7.55, 10.94);
      show("#b5", 10.94, 12.81);
      show("#b6", 12.81, 16.04);
      show("#b7", 16.04, 19.47);
      show("#b8", 19.47, 23.48);
      show("#b9", 23.48, 27.0);

      // CTA
      const LAST_LYRIC_END = 27.0;
      tl.fromTo("#bcta",
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" }, LAST_LYRIC_END + 0.5);

      // Fadeout (39.0s → 42s)
      tl.to("#fadeout", { opacity: 1, duration: 3.0, ease: "power2.in" }, 39.0);
      tl.set("#fadeout", { opacity: 1 }, 42.0);

      window.__timelines = window.__timelines || {};
      window.__timelines["song"] = tl;
    </script>
  </div>
</template>
