    <!-- Persistent metadata (always visible, center-bottom) -->

    <!-- Full-screen fadeout overlay -->
    <div id="fadeout" style="position:absolute;inset:0;background:#000;opacity:0;z-index:20;pointer-events:none;"></div>

    <style>
      [data-composition-id="song"] {

      }

      .intro-artist {

      }
      .intro-rule {

      }
      .intro-title {

        color: #999;
      }
      .intro-meta {
        font-size: 22px;

      }

      #watermark {
        position: absolute;
        bottom: 90px;

        text-align: center;
        font-size: 22px;
        font-weight: 700;
        color: #333;
        letter-spacing: 0.05em;
        z-index: 10;
      }

      #meta-bar {
        position: absolute;
        bottom: 210px;
        left: 0;
        right: 0;
        display: flex;
        flex-direction: column;
        align-items: center;

      }
      .meta-artist {
        font-size: 36px;

      .block {
        position: absolute;
        top: 50%;
        left: 90px;
        right: 90px;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        opacity: 0;
      }

      /* bintro uses explicit top so GSAP can animate scale/y freely */
      #bintro {
        top: 770px;
        transform: none;
      }

      .en {
        font-size: 72px;
        font-weight: 900;
        color: #fff;
        line-height: 1.08;
        letter-spacing: -0.02em;
      }

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      const tl = gsap.timeline({ paused: true });

      tl.set(".block", { opacity: 0 }, 0);
      tl.set(".intro-rule", { width: 0 }, 0);
      tl.set("#meta-bar", { opacity: 0 }, 0);

      // ── Intro (0–2.3s) ───────────────────────────────────────
      tl.fromTo("#bintro",
        { opacity: 0, scale: 0.95, transformOrigin: "center top" },
        { opacity: 1, scale: 1, duration: 0.6, ease: "expo.out" }, 0.1);
      tl.to(".intro-rule", { width: 120, duration: 0.5, ease: "expo.out" }, 0.5);

      // ── Shrink + move to bottom-center (2.0–2.7s) ────────────
      tl.to("#bintro", {
        scale: 0.13,
        y: 1000,
        transformOrigin: "center top",
        duration: 0.7,
        ease: "expo.in"
      }, 2.0);
      tl.to("#bintro", { opacity: 0, duration: 0.3, ease: "power2.in" }, 2.5);
      tl.set("#bintro", { opacity: 0 }, 2.8);

      tl.fromTo("#meta-bar",
        { opacity: 0 },
        { opacity: 1, duration: 0.4, ease: "power2.out" }, 2.5);

      // ── Lyric blocks ─────────────────────────────────────────
      // タイミング = VTT秒 - VERSE_START（ffmpegの-ssオフセット）
      // 例: VTTが20.3sでVERSE_START=18なら → show("#b1", 2.3, 次の行のVTT-18)
      function show(id, t, t2) {
        tl.fromTo(id,
          { opacity: 0, y: 20 },
          { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, t);
        if (t2) {
          tl.to(id, { opacity: 0, duration: 0.2, ease: "power2.in" }, t2 - 0.2);
          tl.set(id, { opacity: 0 }, t2);
        }
      }

      // VTT timestamps minus VERSE_START=53
      // Note: VTT is from a different video; slight timing offset possible
      show("#b1", 1.3, 4.46);
      show("#b2", 4.46, 9.14);
      show("#b3", 9.14, 13.54);
      show("#b4", 13.54, 19.24);
      show("#b5", 19.24, 24.24);
      show("#b6", 24.24, 29.04);
      show("#b7", 29.04, 34.7);
      show("#b8", 34.7, 37.75);
      show("#b9", 37.75, 39);

      // CTA
      const LAST_LYRIC_END = 38.5;
      tl.fromTo("#bcta",
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" }, LAST_LYRIC_END + 0.5);

      // Fadeout (39.0s → 42s)
      tl.to("#fadeout", { opacity: 1, duration: 3.0, ease: "power2.in" }, 39.0);
      tl.set("#fadeout", { opacity: 1 }, 42.0);

      window.__timelines = window.__timelines || {};
      window.__timelines["song"] = tl;
    </script>
