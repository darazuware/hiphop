<template id="song-template">
  <div
    data-composition-id="song"
    data-width="1080"
    data-height="1920"
    data-duration="38"
  >
    <div style="position:absolute;inset:0;background:#000;z-index:0;"></div>
    <audio id="bg-audio" src="../assets/audio.mp3" data-start="0" data-duration="38"></audio>

    <div id="watermark">waxthink.com</div>

    <!-- INTRO (0–2.3s) -->
    <div class="block" id="bintro">
      <div class="intro-artist">NAS</div>
      <div class="intro-rule" id="intro-rule"></div>
      <div class="intro-title">N.Y. State of Mind</div>
      <div class="intro-meta">1994&#160;&#160;·&#160;&#160;DJ PREMIER</div>
    </div>

    <!-- Block 1 -->
    <div class="block" id="b1">
      <div class="en">I monkey-flip 'em with the funky rhythm I be kickin'</div>
      <div class="sep"></div>
      <div class="jp">ファンキーなリズムで<br>奴らをぶっ飛ばす</div>
    </div>

    <!-- Block 2 -->
    <div class="block" id="b2">
      <div class="en">Musician, inflictin' composition of pain</div>
      <div class="sep"></div>
      <div class="jp">ミュージシャン、<br>痛みの楽曲を刻み込む</div>
    </div>

    <!-- Block 3 -->
    <div class="block" id="b3">
      <div class="en">I'm like Scarface sniffin' cocaine</div>
      <div class="sep"></div>
      <div class="jp">コカインを吸うスカーフェイスのように</div>
    </div>

    <!-- Block 4 -->
    <div class="block" id="b4">
      <div class="en">Holdin' an M16, see, with the pen I'm extreme</div>
      <div class="sep"></div>
      <div class="jp">M16を手に、<br>ペンを持てば俺は極限だ</div>
    </div>

    <!-- Block 5 -->
    <div class="block" id="b5">
      <div class="en">Bullet holes left in my peepholes</div>
      <div class="sep"></div>
      <div class="jp">覗き穴に残る弾の跡</div>
    </div>

    <!-- Block 6 -->
    <div class="block" id="b6">
      <div class="en">I'm suited up with street clothes</div>
      <div class="sep"></div>
      <div class="jp">ストリートの服で武装している</div>
    </div>

    <!-- Block 7 -->
    <div class="block" id="b7">
      <div class="en">Hand me a .9 and I'll defeat foes</div>
      <div class="sep"></div>
      <div class="jp">9mmをよこせ、<br>敵をなぎ倒してやる</div>
    </div>

    <!-- Block 8 -->
    <div class="block" id="b8">
      <div class="en">Y'all know my steelo, with or without the airplay</div>
      <div class="sep"></div>
      <div class="jp">オンエアがあろうとなかろうと<br>俺のスタイルはお前らも知ってる</div>
    </div>

    <!-- Block 9 -->
    <div class="block" id="b9">
      <div class="en">I keep some E&amp;J, sittin' bent up in the stairway</div>
      <div class="sep"></div>
      <div class="jp">E&Jを飲みながら<br>階段にもたれかかる</div>
    </div>

    <!-- CTA (最後の歌詞後) -->
    <div class="block" id="bcta">
      <div class="cta-sub">全歌詞・完全翻訳はこちら</div>
      <div class="cta-url">waxthink.com</div>
    </div>

    <!-- Persistent metadata (always visible, center-bottom) -->
    <div id="meta-bar">
      <div class="meta-artist">NAS</div>
      <div class="meta-title-group">
        <div class="meta-title">N.Y. State of Mind</div>
        <div class="meta-rule"></div>
      </div>
      <div class="meta-info">1994&#160;&#160;·&#160;&#160;DJ PREMIER</div>
    </div>

    <!-- Full-screen fadeout overlay -->
    <div id="fadeout" style="position:absolute;inset:0;background:#000;opacity:0;z-index:20;pointer-events:none;"></div>

    <style>
      [data-composition-id="song"] {
        background: #000;
        font-family: 'Inter', sans-serif;
        color: #fff;
        overflow: hidden;
      }

      .intro-artist {
        font-size: 200px;
        font-weight: 900;
        letter-spacing: -0.04em;
        line-height: 1;
        color: #fff;
      }
      .intro-rule {
        width: 0;
        height: 3px;
        background: #c8a96b;
        margin: 32px 0 28px;
      }
      .intro-title {
        font-size: 54px;
        font-weight: 400;
        color: #999;
      }
      .intro-meta {
        font-size: 22px;
        letter-spacing: 0.22em;
        color: #444;
        margin-top: 18px;
        text-transform: uppercase;
      }

      #watermark {
        position: absolute;
        bottom: 90px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 22px;
        font-weight: 700;
        color: #333;
        letter-spacing: 0.05em;
        z-index: 10;
      }

      #meta-bar {
        position: absolute;
        bottom: 210px;
        left: 0;
        right: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        z-index: 10;
      }
      .meta-artist {
        font-size: 36px;
        font-weight: 900;
        color: #fff;
        letter-spacing: -0.02em;
        line-height: 1;
      }
      .meta-title {
        font-size: 34px;
        font-weight: 400;
        color: #888;
        letter-spacing: 0.02em;
        margin-top: 5px;
        white-space: nowrap;
      }
      .meta-title-group {
        display: inline-block;
      }
      .meta-rule {
        width: 100%;
        height: 2px;
        background: #c8a96b;
        margin: 10px 0;
      }
      .meta-info {
        font-size: 24px;
        font-weight: 400;
        color: #444;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .block {
        position: absolute;
        top: 50%;
        left: 90px;
        right: 90px;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        opacity: 0;
      }

      /* bintro uses explicit top so GSAP can animate scale/y freely */
      #bintro {
        top: 770px;
        transform: none;
      }

      .en {
        font-size: 72px;
        font-weight: 900;
        color: #fff;
        line-height: 1.08;
        letter-spacing: -0.02em;
      }
      .sep {
        width: 48px;
        height: 2px;
        background: #c8a96b;
        margin: 24px 0;
        flex-shrink: 0;
      }
      .jp {
        font-family: 'Noto Sans JP', sans-serif;
        font-size: 46px;
        font-weight: 700;
        color: #c8a96b;
        line-height: 1.45;
      }

      .cta-sub {
        font-family: 'Noto Sans JP', sans-serif;
        font-size: 38px;
        font-weight: 400;
        color: #888;
        letter-spacing: 0.05em;
      }
      .cta-url {
        font-size: 96px;
        font-weight: 900;
        color: #fff;
        letter-spacing: -0.03em;
        margin-top: 20px;
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      const tl = gsap.timeline({ paused: true });

      tl.set(".block", { opacity: 0 }, 0);
      tl.set(".intro-rule", { width: 0 }, 0);
      tl.set("#meta-bar", { opacity: 0 }, 0);

      // ── Intro (0–2.3s) ───────────────────────────────────────
      tl.fromTo("#bintro",
        { opacity: 0, scale: 0.95, transformOrigin: "center top" },
        { opacity: 1, scale: 1, duration: 0.6, ease: "expo.out" }, 0.1);
      tl.to(".intro-rule", { width: 120, duration: 0.5, ease: "expo.out" }, 0.5);

      // ── Shrink + move to bottom-center (2.0–2.7s) ────────────
      tl.to("#bintro", {
        scale: 0.13,
        y: 1000,
        transformOrigin: "center top",
        duration: 0.7,
        ease: "expo.in"
      }, 2.0);
      tl.to("#bintro", { opacity: 0, duration: 0.3, ease: "power2.in" }, 2.5);
      tl.set("#bintro", { opacity: 0 }, 2.8);

      tl.fromTo("#meta-bar",
        { opacity: 0 },
        { opacity: 1, duration: 0.4, ease: "power2.out" }, 2.5);

      // ── Lyric blocks ─────────────────────────────────────────
      // タイミング = VTT秒 - VERSE_START（ffmpegの-ssオフセット）
      // 例: VTTが20.3sでVERSE_START=18なら → show("#b1", 2.3, 次の行のVTT-18)
      function show(id, t, t2) {
        tl.fromTo(id,
          { opacity: 0, y: 20 },
          { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, t);
        if (t2) {
          tl.to(id, { opacity: 0, duration: 0.2, ease: "power2.in" }, t2 - 0.2);
          tl.set(id, { opacity: 0 }, t2);
        }
      }

      // Whisper timestamps minus VERSE_START=21
      // monkey=23.84-21=2.84, musician=26.84-21=5.84, scarface=29.81-21=8.81
      // M16=31.0-21=10.0, bullet=34.0-21=13.0, suited=36.21-21=15.21
      // .9=38.0-21=17.0, steelo=40.0-21=19.0, E&J=43.0-21=22.0
      show("#b1",  2.84,  5.84);
      show("#b2",  5.84,  8.81);
      show("#b3",  8.81, 10.0);
      show("#b4", 10.0,  13.0);
      show("#b5", 13.0,  15.21);
      show("#b6", 15.21, 17.0);
      show("#b7", 17.0,  19.0);
      show("#b8", 19.0,  22.0);
      show("#b9", 22.0,  25.5);

      // CTA
      const LAST_LYRIC_END = 25.5;
      tl.fromTo("#bcta",
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" }, LAST_LYRIC_END + 0.5);

      // Fadeout (35.0s → 38s)
      tl.to("#fadeout", { opacity: 1, duration: 3.0, ease: "power2.in" }, 35.0);
      tl.set("#fadeout", { opacity: 1 }, 38.0);

      window.__timelines = window.__timelines || {};
      window.__timelines["song"] = tl;
    </script>
  </div>
</template>
