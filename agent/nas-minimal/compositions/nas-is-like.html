      // ── Intro (0–2.0s): big title card ───────────────────────
      tl.fromTo("#bintro",
        { opacity: 0, scale: 0.95, transformOrigin: "left top" },
        { opacity: 1, scale: 1, duration: 0.6, ease: "expo.out" }, 0.1);
      tl.to(".intro-rule", { width: 120, duration: 0.5, ease: "expo.out" }, 0.5);

      // ── Shrink + move to bottom-center (2.0–2.7s) ────────────

        scale: 0.13,
        y: 1000,
        transformOrigin: "center top",
        duration: 0.7,
        ease: "expo.in"
      }, 2.0);
      tl.to("#bintro", { opacity: 0, duration: 0.3, ease: "power2.in" }, 2.5);
      tl.set("#bintro", { opacity: 0 }, 2.8);

      // ── Meta bar フェードイン (transform不使用・opacity only) ──
      tl.fromTo("#meta-bar",
        { opacity: 0 },
        { opacity: 1, duration: 0.4, ease: "power2.out" }, 2.5);

      // Helper: show lyric block at t, hide at t2
      function show(id, t, t2) {
        tl.fromTo(id,
          { opacity: 0, y: 20 },
          { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, t);
        if (t2) {
          tl.to(id, { opacity: 0, duration: 0.2, ease: "power2.in" }, t2 - 0.2);
          tl.set(id, { opacity: 0 }, t2);
        }
      }

      // VTT original timestamps - 18s offset

      show("#b2",  3.7,  6.1);
      show("#b3",  6.1,  7.2);
      show("#b4",  7.2, 10.4);
      show("#b5", 10.4, 12.3);
      show("#b6", 12.3, 14.1);
      show("#b7", 14.1, 15.6);
      show("#b8", 15.6, 17.2);
      show("#b9", 17.2, 20.1);
      show("#b10",20.1, 22.7);
      show("#b11",22.7, 24.8);
      show("#b12",24.8, 27.7);
      show("#b13",27.7, 30.0);

        { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" }, 31.5);

      tl.set("#fadeout", { opacity: 1 }, 38);

      window.__timelines = window.__timelines || {};
      window.__timelines["nas-is-like"] = tl;
