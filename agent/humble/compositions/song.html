    <script>
      const tl = gsap.timeline({paused:true});
      tl.set(".block",{opacity:0},0);

      tl.set("#meta-bar",{opacity:0},0);

      tl.set("#bintro",{opacity:0},2.8);
      tl.fromTo("#meta-bar",{opacity:0},{opacity:1,duration:0.4,ease:"power2.out"},2.5);
      function show(id,t,t2){
        tl.fromTo(id,{opacity:0,y:20},{opacity:1,y:0,duration:0.3,ease:"power2.out"},t);
        if(t2){tl.to(id,{opacity:0,duration:0.2,ease:"power2.in"},t2-0.2);tl.set(id,{opacity:0},t2);}

      show("#b1", 2.27, 6.03);
      show("#b2", 6.03, 12.17);
      show("#b3", 12.17, 18.73);
      show("#b4", 18.73, 25.07);

      tl.fromTo("#bcta",{opacity:0},{opacity:1,duration:0.8,ease:"power1.out"},37.5);
      window.__timelines=window.__timelines||{};
      window.__timelines["song"]=tl;
