<template id="song-template">
  <div
    data-composition-id="song"
    data-width="1080"
    data-height="1920"
    data-duration="TOTAL_DURATION"
  >
    <div style="position:absolute;inset:0;background:#000;z-index:0;"></div>
    <audio id="bg-audio" src="../assets/audio.mp3" data-start="0" data-duration="TOTAL_DURATION"></audio>

    <div id="watermark">waxthink.com</div>

    <!-- INTRO (0–2.3s) -->
    <div class="block" id="bintro">
      <div class="intro-artist">ARTIST_NAME</div>
      <div class="intro-rule" id="intro-rule"></div>
      <div class="intro-title">SONG_TITLE</div>
      <div class="intro-meta">YEAR&nbsp;&nbsp;·&nbsp;&nbsp;prod. PRODUCER</div>
    </div>

    <!-- LYRIC BLOCKS: VTT秒 - VERSE_START = 動画内秒 -->
    <!-- show("#b1", VIDEO_START, VIDEO_END) で表示タイミングを制御 -->

    <div class="block" id="b1">
      <div class="en">English lyric line 1</div>
      <div class="sep"></div>
      <div class="jp">日本語訳1行目</div>
    </div>

    <div class="block" id="b2">
      <div class="en">English lyric line 2</div>
      <div class="sep"></div>
      <div class="jp">日本語訳2行目</div>
    </div>

    <div class="block" id="b3">
      <div class="en">English lyric line 3</div>
      <div class="sep"></div>
      <div class="jp">日本語訳3行目</div>
    </div>

    <div class="block" id="b4">
      <div class="en">English lyric line 4</div>
      <div class="sep"></div>
      <div class="jp">日本語訳4行目</div>
    </div>

    <div class="block" id="b5">
      <div class="en">English lyric line 5</div>
      <div class="sep"></div>
      <div class="jp">日本語訳5行目</div>
    </div>

    <div class="block" id="b6">
      <div class="en">English lyric line 6</div>
      <div class="sep"></div>
      <div class="jp">日本語訳6行目</div>
    </div>

    <div class="block" id="b7">
      <div class="en">English lyric line 7</div>
      <div class="sep"></div>
      <div class="jp">日本語訳7行目</div>
    </div>

    <div class="block" id="b8">
      <div class="en">English lyric line 8</div>
      <div class="sep"></div>
      <div class="jp">日本語訳8行目</div>
    </div>

    <!-- 必要に応じてb9, b10... と追加 -->

    <!-- CTA (最後の歌詞後) -->
    <div class="block" id="bcta">
      <div class="bcta-rule"></div>
      <div class="bcta-brand">WAX&amp;THINK</div>
      <div class="bcta-url">waxthink.com</div>
    </div>

    <!-- Persistent metadata (always visible, center-bottom) -->
    <div id="meta-bar">
      <div class="meta-artist">ARTIST_NAME</div>
      <div class="meta-title-group">
        <div class="meta-title">SONG_TITLE</div>
        <div class="meta-rule"></div>
      </div>
      <div class="meta-info">YEAR&nbsp;&nbsp;·&nbsp;&nbsp;PRODUCER</div>
    </div>

    <!-- Full-screen fadeout overlay -->
    <div id="fadeout" style="position:absolute;inset:0;background:#000;opacity:0;z-index:20;pointer-events:none;"></div>

    <style>
      [data-composition-id="song"] {
        background: #000;
        font-family: 'Inter', sans-serif;
        color: #fff;
        overflow: hidden;
      }

      .intro-artist {
        font-size: 200px;
        font-weight: 900;
        letter-spacing: -0.04em;
        line-height: 1;
        color: #fff;
      }
      .intro-rule {
        width: 0;
        height: 3px;
        background: #c8a96b;
        margin: 32px 0 28px;
      }
      .intro-title {
        font-size: 54px;
        font-weight: 400;
        color: #999;
      }
      .intro-meta {
        font-size: 22px;
        letter-spacing: 0.22em;
        color: #444;
        margin-top: 18px;
        text-transform: uppercase;
      }

      #watermark {
        position: absolute;
        bottom: 90px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 22px;
        font-weight: 700;
        color: #333;
        letter-spacing: 0.05em;
        z-index: 10;
      }

      #meta-bar {
        position: absolute;
        bottom: 210px;
        left: 0;
        right: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        z-index: 10;
      }
      .meta-artist {
        font-size: 36px;
        font-weight: 900;
        color: #fff;
        letter-spacing: -0.02em;
        line-height: 1;
      }
      .meta-title {
        font-size: 34px;
        font-weight: 400;
        color: #888;
        letter-spacing: 0.02em;
        margin-top: 5px;
        white-space: nowrap;
      }
      .meta-title-group {
        display: inline-block;
      }
      .meta-rule {
        width: 100%;
        height: 2px;
        background: #c8a96b;
        margin: 10px 0;
      }
      .meta-info {
        font-size: 24px;
        font-weight: 400;
        color: #444;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .block {
        position: absolute;
        top: 50%;
        left: 90px;
        right: 90px;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        opacity: 0;
      }

      /* bintro uses explicit top so GSAP can animate scale/y freely */
      #bintro {
        top: 770px;
        transform: none;
      }

      .en {
        font-size: 72px;
        font-weight: 900;
        color: #fff;
        line-height: 1.08;
        letter-spacing: -0.02em;
      }
      .sep {
        width: 48px;
        height: 2px;
        background: #c8a96b;
        margin: 24px 0;
        flex-shrink: 0;
      }
      .jp {
        font-family: 'Noto Sans JP', sans-serif;
        font-size: 46px;
        font-weight: 700;
        color: #c8a96b;
        line-height: 1.45;
      }

      #bcta { z-index: 25; align-items: center; }
      .bcta-rule { width: 48px; height: 2px; background: #c8a96b; margin-bottom: 32px; }
      .bcta-brand { font-size: 120px; font-weight: 900; color: #fff; letter-spacing: -0.04em; line-height: 1; }
      .bcta-url { font-size: 26px; font-weight: 400; color: #555; letter-spacing: 0.18em; margin-top: 20px; }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      const tl = gsap.timeline({ paused: true });

      tl.set(".block", { opacity: 0 }, 0);
      tl.set(".intro-rule", { width: 0 }, 0);
      tl.set("#meta-bar", { opacity: 0 }, 0);

      // ── Intro (0–2.3s) ───────────────────────────────────────
      tl.fromTo("#bintro",
        { opacity: 0, scale: 0.95, transformOrigin: "center top" },
        { opacity: 1, scale: 1, duration: 0.6, ease: "expo.out" }, 0.1);
      tl.to(".intro-rule", { width: 120, duration: 0.5, ease: "expo.out" }, 0.5);

      // ── Shrink + move to bottom-center (2.0–2.7s) ────────────
      tl.to("#bintro", {
        scale: 0.13,
        y: 1000,
        transformOrigin: "center top",
        duration: 0.7,
        ease: "expo.in"
      }, 2.0);
      tl.to("#bintro", { opacity: 0, duration: 0.3, ease: "power2.in" }, 2.5);
      tl.set("#bintro", { opacity: 0 }, 2.8);

      tl.fromTo("#meta-bar",
        { opacity: 0 },
        { opacity: 1, duration: 0.4, ease: "power2.out" }, 2.5);

      // ── Lyric blocks ─────────────────────────────────────────
      // タイミング = VTT秒 - VERSE_START（ffmpegの-ssオフセット）
      // 例: VTTが20.3sでVERSE_START=18なら → show("#b1", 2.3, 次の行のVTT-18)
      function show(id, t, t2) {
        tl.fromTo(id,
          { opacity: 0, y: 20 },
          { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, t);
        if (t2) {
          tl.to(id, { opacity: 0, duration: 0.2, ease: "power2.in" }, t2 - 0.2);
          tl.set(id, { opacity: 0 }, t2);
        }
      }

      // ↓ VTT秒 - VERSE_STARTで計算した値を入れる
      show("#b1",  2.3,  4.0);
      show("#b2",  4.0,  6.0);
      show("#b3",  6.0,  8.0);
      show("#b4",  8.0, 10.0);
      show("#b5", 10.0, 12.0);
      show("#b6", 12.0, 14.0);
      show("#b7", 14.0, 16.0);
      show("#b8", 16.0, 18.0);
      // 必要に応じて追加

      // ── エンディング: 黒フェード → WAXTHINK フェードイン ──────
      // LAST_LYRIC_END = 最後のブロックのt2値（更新すること）
      // TOTAL_DURATIONは data-duration の値（更新すること）
      const LAST_LYRIC_END = 18.0;  // ← 更新すること
      const TOTAL_DURATION_SEC = TOTAL_DURATION;  // ← 数値に置き換えること（例: 40）
      tl.to("#fadeout", { opacity: 1, duration: 1.2, ease: "power2.in" }, TOTAL_DURATION_SEC - 4.5);
      tl.set("#fadeout", { opacity: 1 }, TOTAL_DURATION_SEC);
      tl.fromTo("#bcta",
        { opacity: 0 },
        { opacity: 1, duration: 0.8, ease: "power1.out" }, TOTAL_DURATION_SEC - 3.5);

      window.__timelines = window.__timelines || {};
      window.__timelines["song"] = tl;
    </script>
  </div>
</template>
