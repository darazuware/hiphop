      <div data-hf-id="hf-ei98" id="root" data-composition-id="06-8mile" data-width="1920" data-height="1080" data-duration="38.4">
        <svg data-hf-id="hf-p3r6" width="0" height="0" aria-hidden="true" style="position: absolute">
          <filter data-hf-id="hf-aad9" id="f06-streak" x="-50%" y="-50%" width="200%" height="200%">
            <fegaussianblur data-hf-id="hf-ktis" id="f06-streak-blur" in="SourceGraphic" stdDeviation="0 0" />
          </filter>
        </svg>

        <div data-hf-id="hf-tvri" class="f06-cam" id="f06-cam" style="filter: url(#f06-streak)">
          <video data-hf-id="hf-82qj" id="f06-video" class="clip" src="assets/clips/06-8mile-trailer.mp4" data-start="0" data-duration="38.4" data-track-index="0" data-media-start="0" muted playsinline></video>

          </div>
          <div data-hf-id="hf-t1hg" class="f06-chunk" id="f06-chunk-1">
            <span data-hf-id="hf-0ali" class="f06-frag">オープニングの楽屋シーンと、</span><span data-hf-id="hf-2sd4" class="f06-frag">ラストのバトルシーン、2箇所で流れています。</span>

      <script>
        (function () {
          window.__timelines = window.__timelines || {};
          var tl = gsap.timeline({ paused: true });

          // ---- captions: compute chunk start times from static text length first ----
          var F = 1 / 60;
          function waterfallReveal(container, startTime) {
            var frags = container.querySelectorAll(".f06-frag");
            var t = startTime;
            for (var i = 0; i < frags.length; i++) {
              var isFirst = i === 0;
              var Y = isFirst ? 46 : 40;
              var dur = isFirst ? 0.16 : 0.13;
              var overlapFrames = isFirst ? 1 : 2;
              tl.set(frags[i], { opacity: 1, y: Y }, t);
              tl.to(frags[i], { y: 0, duration: dur, ease: "power4.out" }, t);
              t += dur - overlapFrames * F;
            }
          }

          var chunkEls = Array.prototype.slice.call(document.querySelectorAll(".f06-chunk"));
          var weights = chunkEls.map(function (el) {
            return el.textContent.length;
          });
          var totalWeight = weights.reduce(function (a, b) {
            return a + b;
          }, 0);

          var CAPTION_START = 2.8;
          var CAPTION_END = 35.5;
          var spanT = CAPTION_END - CAPTION_START;
          var starts = [];
          var acc = CAPTION_START;
          for (var w = 0; w < weights.length; w++) {
            starts.push(acc);
            acc += spanT * (weights[w] / totalWeight);
          }

          // ---- entrance: video pushes out of soft focus and settles sharp by t<=0.5s ----
          var blurNode = document.getElementById("f06-streak-blur");
          var blurProxy = { v: 20 };
          var writeBlur = function () {
            blurNode.setAttribute("stdDeviation", blurProxy.v + " " + blurProxy.v);
          };
          writeBlur();
          tl.fromTo(
            "#f06-cam",
            { scale: 1.4 },
            { scale: 1, duration: 0.45, ease: "power3.out" },
            0,
          );
          tl.to(blurProxy, { v: 0, duration: 0.45, ease: "power3.out", onUpdate: writeBlur }, 0);

          // ---- headline settles in right after the entrance ----
          tl.fromTo(
            ".f06-headline-wrap",
            { opacity: 0, y: 26 },
            { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
            0.5,
          );

          // ---- dwell zoom into the frozen trailer frame, synced to the Havoc reaction line ----
          var ZOOM_AT = starts[2];
          var ZOOM_DUR = 1.6;
          tl.to("#f06-cam", { scale: 1.35, duration: ZOOM_DUR, ease: "power3.inOut" }, ZOOM_AT);

          chunkEls.forEach(function (el, i) {
            if (i > 0) {
              tl.to(
                chunkEls[i - 1],
                { opacity: 0, duration: 0.25, ease: "power2.in" },
                starts[i] - 0.25,
              );
            }
            waterfallReveal(el, starts[i]);
          });

          window.__timelines["06-8mile"] = tl;
        })();
      </script>
