<script>
  (function () {
    var F = 1 / 60;

    function wf(tl, phraseEls, t0) {
      var t = t0;
      phraseEls.forEach(function (el, i) {
        var isAnchor = i === 0;
        var y = isAnchor ? 64 : 42;
        var dur = isAnchor ? 0.18 : 0.14;
        tl.set(el, { opacity: 1, y: y }, t);
        tl.to(el, { y: 0, duration: dur, ease: "power4.out" }, t);
        t = t + dur - (isAnchor ? F : 2 * F);
      });
    }

    function showCaption(tl, id, phraseIds, enterAt, exitAt) {
      // exitAt === null holds the caption to the end of the scene.
      var wrap = document.getElementById(id);
      var phrases = phraseIds.map(function (pid) { return document.getElementById(pid); });
      tl.set(wrap, { display: "inline-block", autoAlpha: 1 }, enterAt - F);
      wf(tl, phrases, enterAt);
      if (exitAt !== null) {
        tl.to(wrap, { autoAlpha: 0, duration: 0.28, ease: "power2.in" }, exitAt);
      }
    }

    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    // ================= HEADLINE =================
    tl.set("#h3-hl-1", { opacity: 1, y: 66 }, 0.15);
    tl.to("#h3-hl-1", { y: 0, duration: 0.2, ease: "power4.out" }, 0.15);
    tl.set("#h3-hl-2", { opacity: 1, y: 56 }, 0.32);
    tl.to("#h3-hl-2", { y: 0, duration: 0.22, ease: "power4.out" }, 0.32);
    // gradient-text-sweep: continuous sweep through "3枚のレコードの重ね技"
    tl.fromTo(
      "#h3-hl-grad",
      { backgroundPosition: "100% 50%" },
      { backgroundPosition: "0% 50%", duration: 2.0, ease: "none" },
      1.1
    );

    // ================= JACKETS: spring-pop-entrance, staggered =================
    tl.fromTo("#h3-jacket-hancock", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" }, 1.0);
    tl.fromTo("#h3-jacket-jones", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" }, 1.5);
    tl.fromTo("#h3-jacket-daly", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" }, 2.0);
    tl.to("#h3-jacket-jones .h3-jacket-tag, #h3-jacket-daly .h3-jacket-tag, #h3-jacket-hancock .h3-jacket-tag",
      { opacity: 1, duration: 0.4, ease: "power2.out", stagger: 0.15 }, 2.6);

    // settle to a smaller resting size once introduced, leaving them lined up
    // (per operator direction) but freeing visual weight for the zoom-in below
    tl.to("#h3-jacket-hancock, #h3-jacket-jones, #h3-jacket-daly",
      { scale: 0.62, duration: 0.5, ease: "power2.inOut" }, 3.2);

    // ================= JACKET RINGS + ZOOM: the jacket currently being explained
    // pops back up to full size (in place — the tag scales up with it) exactly
    // while its own waveform is in the spotlight slot below =================
    // pinned to the same handoff instants as the waveform spotlight below
    // (6.95 / 12.5 / 17.5 / 22.5) so jacket, wave and sound move as one beat
    tl.fromTo("#h3-ring-hancock", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 6.95);
    tl.to("#h3-jacket-hancock", { scale: 1, duration: 0.4, ease: "power3.out" }, 6.95);
    tl.to("#h3-ring-hancock", { opacity: 0, duration: 0.3, ease: "power2.in" }, 12.5);
    tl.to("#h3-jacket-hancock", { scale: 0.62, duration: 0.4, ease: "power3.inOut" }, 12.5);
    tl.fromTo("#h3-ring-jones", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 12.5);
    tl.to("#h3-jacket-jones", { scale: 1, duration: 0.4, ease: "power3.inOut" }, 12.5);
    tl.to("#h3-ring-jones", { opacity: 0, duration: 0.3, ease: "power2.in" }, 17.5);
    tl.to("#h3-jacket-jones", { scale: 0.62, duration: 0.4, ease: "power3.inOut" }, 17.5);
    tl.fromTo("#h3-ring-daly", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 17.5);
    tl.to("#h3-jacket-daly", { scale: 1, duration: 0.4, ease: "power3.inOut" }, 17.5);
    tl.to("#h3-ring-daly", { opacity: 0, duration: 0.3, ease: "power2.in" }, 22.5);
    tl.to("#h3-jacket-daly", { scale: 0.62, duration: 0.4, ease: "power3.inOut" }, 22.5);

    // jackets recede into the background once the sample breakdown is told,
    // making room for the anecdote captions (phase 1 -> phase 2 handoff)
    tl.to("#h3-jacket-cluster", { scale: 0.8, y: -60, opacity: 0.28, duration: 1.0, ease: "power2.inOut" }, 26.5);

    // ================= WAVEFORM STACK =================
    // waterfall-entry: three rows rise/fade in, tight stagger, each settling
    // into its own thin idle slot
    // enter while cap-0 is still saying "3枚を重ねて作られています" so the three
    // lined-up bars land on that line, settled well before the first spotlight
    tl.fromTo("#h3-wave-jessica", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power4.out" }, 5.6);
    tl.fromTo("#h3-wave-kitty", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power4.out" }, 5.75);
    tl.fromTo("#h3-wave-dirtyfeet", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power4.out" }, 5.9);
    tl.fromTo("#h3-wave-jessica-meta, #h3-wave-kitty-meta, #h3-wave-dirtyfeet-meta",
      { opacity: 0 }, { opacity: 1, duration: 0.4, stagger: 0.15, ease: "power2.out" }, 5.6);

    // ---- spotlight: grow the active row DOWNWARD, push the rows below it ----
    // Slots (CSS top): jessica 0, kitty 26, dirtyfeet 52; idle height 18.
    // The tall row is 104px and every row under it takes y:+86, so the layout
    // is one of four states and the 8px gaps never close:
    //   idle    J 0-18    K 26-44    D 52-70
    //   J tall  J 0-104   K 112-130  D 138-156
    //   K tall  J 0-18    K 26-130   D 138-156
    //   D tall  J 0-18    K 26-44    D 52-156
    // Because bottom(row_i) and top(row_i+1) both carry the same +86p term
    // during a tween, the gap holds at 8px for every intermediate frame too —
    // this is what makes the old "wave slides over its neighbour" impossible
    // rather than merely unlikely. Motion is `y` (transform) only: a lint rule
    // here rejects `top`-based motion because it snaps to integer device
    // pixels under seek-by-frame capture and stutters.
    // Each label mirrors its own row (+43 when tall, +86 when pushed down) and
    // stays >=26px clear of the others; nothing needs dimming to hide a clash,
    // so all three names stay readable the whole way through.
    var GROW = { duration: 0.4, ease: "power3.out" };
    var SHRINK = { duration: 0.4, ease: "power3.inOut" };

    // Jessica takes the spotlight (cap-1 / its audio, 7.0)
    tl.to("#h3-wave-jessica", Object.assign({ height: 104 }, GROW), 6.95);
    tl.to("#h3-wave-jessica-meta", Object.assign({ y: 43 }, GROW), 6.95);
    tl.to("#h3-wave-kitty, #h3-wave-dirtyfeet", Object.assign({ y: 86 }, GROW), 6.95);
    tl.to("#h3-wave-kitty-meta, #h3-wave-dirtyfeet-meta", Object.assign({ y: 86 }, GROW), 6.95);
    tl.to("#h3-wave-kitty, #h3-wave-dirtyfeet, #h3-wave-kitty-meta, #h3-wave-dirtyfeet-meta",
      { opacity: 0.5, duration: 0.4 }, 6.95);

    // hand off to Kitty (cap-2 / its audio, 12.9): Jessica shrinks back to its
    // own slot while Kitty rises into the space and grows — same tween window,
    // so the two never occupy the same band
    tl.to("#h3-wave-jessica", Object.assign({ height: 18 }, SHRINK), 12.5);
    tl.to("#h3-wave-jessica-meta", Object.assign({ y: 0 }, SHRINK), 12.5);
    tl.to("#h3-wave-kitty", Object.assign({ y: 0, height: 104 }, SHRINK), 12.5);
    tl.to("#h3-wave-kitty-meta", Object.assign({ y: 43 }, SHRINK), 12.5);
    tl.to("#h3-wave-kitty, #h3-wave-kitty-meta", { opacity: 1, duration: 0.4 }, 12.5);
    tl.to("#h3-wave-jessica, #h3-wave-jessica-meta", { opacity: 0.5, duration: 0.4 }, 12.5);

    // hand off to Dirty Feet (cap-3 / its audio, 17.9)
    tl.to("#h3-wave-kitty", Object.assign({ height: 18 }, SHRINK), 17.5);
    tl.to("#h3-wave-kitty-meta", Object.assign({ y: 0 }, SHRINK), 17.5);
    tl.to("#h3-wave-dirtyfeet", Object.assign({ y: 0, height: 104 }, SHRINK), 17.5);
    tl.to("#h3-wave-dirtyfeet-meta", Object.assign({ y: 43 }, SHRINK), 17.5);
    tl.to("#h3-wave-dirtyfeet, #h3-wave-dirtyfeet-meta", { opacity: 1, duration: 0.4 }, 17.5);
    tl.to("#h3-wave-kitty, #h3-wave-kitty-meta", { opacity: 0.5, duration: 0.4 }, 17.5);

    // all three back to the lined-up idle state for cap-4 ("この3つに、Havoc
    // 自身のハイハットを重ねて") — the three records read as a set again
    tl.to("#h3-wave-dirtyfeet", Object.assign({ height: 18 }, SHRINK), 22.5);
    tl.to("#h3-wave-dirtyfeet-meta", Object.assign({ y: 0 }, SHRINK), 22.5);
    tl.to("#h3-wave-jessica, #h3-wave-kitty, #h3-wave-dirtyfeet, #h3-wave-jessica-meta, #h3-wave-kitty-meta, #h3-wave-dirtyfeet-meta",
      { opacity: 1, duration: 0.4 }, 22.5);

    // gsap-effects audio-visualizer: scrub playback highlight sweeps each row
    // left-to-right in narration order (Jessica piano -> Kitty hats -> Dirty Feet drums)
    /* pixel-width tweens, not percentage — matches the back-to-the-melody/
       hold-you-down recipe. A percentage width tween on this reveal box
       rendered as already-complete on every captured frame under
       HyperFrames' deterministic renderer (verified by sampling render
       output frames a second apart and finding them byte-identical); plain
       pixel widths animate correctly. Each PNG is now rendered from the very
       clip that plays under it, so the end value is the full 1600px bar and
       the start/duration are the <audio> element's own data-start and
       data-duration — the sweep begins with the first sample of sound,
       finishes with the last, and covers the whole waveform with no dead
       tail. ease:"none" (linear, like hold-you-down) keeps the playhead at
       constant real-time speed instead of easing ahead of/behind the ear. */
    tl.fromTo("#h3-wave-jessica-reveal", { width: 4 }, { width: 1600, duration: 5.5, ease: "none", immediateRender: false }, 7.0);
    tl.fromTo("#h3-wave-kitty-reveal", { width: 4 }, { width: 1600, duration: 4.5, ease: "none", immediateRender: false }, 12.9);
    tl.fromTo("#h3-wave-dirtyfeet-reveal", { width: 4 }, { width: 1600, duration: 4.5, ease: "none", immediateRender: false }, 17.9);

    // once all three have played, the stack dims to ambient texture behind
    // the anecdote (phase 2) — never fully hidden, keeps the beat "alive"
    tl.to("#h3-wave-stack", { opacity: 0.32, duration: 1.2, ease: "power2.inOut" }, 26.5);
    // and returns to a readable level for the stove-myth debunk close (phase 3)
    tl.to("#h3-wave-stack", { opacity: 0.55, duration: 1.2, ease: "power2.inOut" }, 48.0);

    // ================= KITCHEN-STOVE MV INSERT (real MV footage, with sound) =================
    tl.fromTo("#h3-kitchen-card", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 0.94, duration: 0.5, ease: "power3.out" }, 48.5);
    tl.to("#h3-kitchen-card", { opacity: 0, duration: 0.4, ease: "power2.in" }, 53.4);

    // gradient-text-sweep emphasis on Prodigy's line, right as the quote lands
    tl.fromTo(
      "#h3-emph-grad",
      { opacity: 0, backgroundPosition: "100% 50%" },
      { opacity: 1, duration: 0.2, ease: "power2.out" },
      39.4
    );
    tl.to("#h3-emph-grad", { backgroundPosition: "0% 50%", duration: 1.1, ease: "none" }, 39.4);

    // ================= CAPTIONS =================
    // -- phase 1: the sample breakdown --
    showCaption(tl, "h3-cap-0", ["h3-cap-0-p0", "h3-cap-0-p1", "h3-cap-0-p2"], 2.4, 6.6);
    showCaption(tl, "h3-cap-1", ["h3-cap-1-p0", "h3-cap-1-p1"], 7.0, 12.6);
    showCaption(tl, "h3-cap-2", ["h3-cap-2-p0", "h3-cap-2-p1"], 12.9, 17.6);
    showCaption(tl, "h3-cap-3", ["h3-cap-3-p0", "h3-cap-3-p1"], 17.9, 22.6);
    showCaption(tl, "h3-cap-4", ["h3-cap-4-p0", "h3-cap-4-p1"], 22.9, 27.0);

    // -- phase 2: the almost-deleted tape --
    showCaption(tl, "h3-cap-5", ["h3-cap-5-p0"], 27.3, 29.5);
    showCaption(tl, "h3-cap-6", ["h3-cap-6-p0", "h3-cap-6-p1", "h3-cap-6-p2"], 29.8, 36.0);
    showCaption(tl, "h3-cap-7", ["h3-cap-7-p0", "h3-cap-7-p1", "h3-cap-7-p2"], 36.3, 43.0);
    showCaption(tl, "h3-cap-8", ["h3-cap-8-p0", "h3-cap-8-p1"], 43.3, 48.0);

    // -- phase 3: the stove myth debunk --
    showCaption(tl, "h3-cap-9", ["h3-cap-9-p0", "h3-cap-9-p1", "h3-cap-9-p2"], 48.3, 55.5);
    showCaption(tl, "h3-cap-10", ["h3-cap-10-p0", "h3-cap-10-p1"], 55.8, 60.0);
    showCaption(tl, "h3-cap-11", ["h3-cap-11-p0", "h3-cap-11-p1"], 60.3, null);

    window.__timelines["03-beat-making"] = tl;
  })();
</script>
