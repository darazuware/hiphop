<script>
  (function () {
    var F = 1 / 60;

    function wf(tl, phraseEls, t0) {
      var t = t0;
      phraseEls.forEach(function (el, i) {
        var isAnchor = i === 0;
        var y = isAnchor ? 64 : 42;
        var dur = isAnchor ? 0.18 : 0.14;
        tl.set(el, { opacity: 1, y: y }, t);
        tl.to(el, { y: 0, duration: dur, ease: "power4.out" }, t);
        t = t + dur - (isAnchor ? F : 2 * F);
      });
    }

    function showCaption(tl, id, phraseIds, enterAt, exitAt) {
      // exitAt === null holds the caption to the end of the scene.
      var wrap = document.getElementById(id);
      var phrases = phraseIds.map(function (pid) { return document.getElementById(pid); });
      tl.set(wrap, { display: "inline-block", autoAlpha: 1 }, enterAt - F);
      wf(tl, phrases, enterAt);
      if (exitAt !== null) {
        tl.to(wrap, { autoAlpha: 0, duration: 0.28, ease: "power2.in" }, exitAt);
      }
    }

    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    // ================= HEADLINE =================
    tl.set("#h3-hl-1", { opacity: 1, y: 66 }, 0.15);
    tl.to("#h3-hl-1", { y: 0, duration: 0.2, ease: "power4.out" }, 0.15);
    tl.set("#h3-hl-2", { opacity: 1, y: 56 }, 0.32);
    tl.to("#h3-hl-2", { y: 0, duration: 0.22, ease: "power4.out" }, 0.32);
    // gradient-text-sweep: continuous sweep through "3枚のレコードの重ね技"
    tl.fromTo(
      "#h3-hl-grad",
      { backgroundPosition: "100% 50%" },
      { backgroundPosition: "0% 50%", duration: 2.0, ease: "none" },
      1.1
    );

    // ================= TRACK ROWS: jacket + own waveform, always visible
    // together — no shared destination for anything to collide at. =================
    // idle zoom-out scale per row's -wrap (fits the whole ~12.5-13.5s strip
    // into its 1300px viewport) vs. active zoom-in scale (fills the viewport
    // with just the real sample region). See the .h3-track-wave-* CSS block
    // for the underlying per-sample pixel geometry these numbers come from.
    var IDLE_SCALE = { jessica: 0.4815, kitty: 0.52, dirtyfeet: 0.52 };
    var ACTIVE_SCALE = { jessica: 1.05, kitty: 1.35, dirtyfeet: 1.35 };
    ["jessica", "kitty", "dirtyfeet"].forEach(function (id) {
      tl.set("#h3-track-" + id + "-wrap", { scale: IDLE_SCALE[id] }, 0);
    });

    // waterfall-entry: three rows rise/fade in together, tight stagger, while
    // cap-0 is still saying "3枚を重ねて作られています" — settled well before
    // the first handoff
    tl.fromTo("#h3-track-jessica", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.5, ease: "power4.out" }, 5.6);
    tl.fromTo("#h3-track-kitty", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.5, ease: "power4.out" }, 5.75);
    tl.fromTo("#h3-track-dirtyfeet", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.5, ease: "power4.out" }, 5.9);

    // handoff/release: the active row's jacket pops to full size with a ring,
    // and its own -wrap scales up around the fixed transform-origin centred
    // on its real sample (see CSS) so it zooms into exactly that region —
    // every other row's box is completely untouched, so nothing here can
    // collide with a neighbour the way the old shared-slot spotlight did.
    function handoff(id, at) {
      tl.to("#h3-track-" + id + "-wrap", { scale: ACTIVE_SCALE[id], duration: 0.5, ease: "power3.out" }, at);
      tl.to("#h3-track-" + id + "-jacket", { scale: 1.08, duration: 0.5, ease: "power3.out" }, at);
      tl.fromTo("#h3-track-" + id + " .h3-track-ring", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, at);
      tl.to("#h3-track-" + id, { opacity: 1, duration: 0.3 }, at);
    }
    function release(id, at) {
      tl.to("#h3-track-" + id + "-wrap", { scale: IDLE_SCALE[id], duration: 0.45, ease: "power3.inOut" }, at);
      tl.to("#h3-track-" + id + "-jacket", { scale: 1, duration: 0.45, ease: "power3.inOut" }, at);
      tl.to("#h3-track-" + id + " .h3-track-ring", { opacity: 0, duration: 0.3, ease: "power2.in" }, at);
      tl.to("#h3-track-" + id, { opacity: 0.55, duration: 0.3 }, at);
    }
    handoff("jessica", 6.95);
    release("jessica", 12.5);
    handoff("kitty", 12.5);
    release("kitty", 17.5);
    handoff("dirtyfeet", 17.5);
    release("dirtyfeet", 22.5);
    // all three back to full readability for cap-4 ("この3つに、Havoc自身の
    // ハイハットを重ねて") — the three records read as a set again
    tl.to("#h3-track-jessica, #h3-track-kitty, #h3-track-dirtyfeet", { opacity: 1, duration: 0.4 }, 22.5);

    // gsap-effects audio-visualizer: scrub playback highlight sweeps the real
    // segment of each row left-to-right in narration order (Jessica piano ->
    // Kitty strings -> Dirty Feet drums).
    /* pixel-width tweens, not percentage — matches the back-to-the-melody/
       hold-you-down recipe (percentage widths and clip-path do not animate
       under HyperFrames' deterministic renderer; plain pixel widths do).
       Each end value is that row's real segment width (1100/900/900px, see
       CSS), and the start/duration are the <audio> element's own data-start
       and data-duration — the sweep begins with the first sample of sound,
       finishes with the last. ease:"none" (linear, like hold-you-down) keeps
       the playhead at constant real-time speed instead of easing ahead
       of/behind the ear. */
    tl.fromTo("#h3-track-jessica-reveal", { width: 4 }, { width: 1100, duration: 5.5, ease: "none", immediateRender: false }, 7.0);
    tl.fromTo("#h3-track-kitty-reveal", { width: 4 }, { width: 900, duration: 4.5, ease: "none", immediateRender: false }, 12.9);
    tl.fromTo("#h3-track-dirtyfeet-reveal", { width: 4 }, { width: 900, duration: 4.5, ease: "none", immediateRender: false }, 17.9);

    // once all three have played, the list dims to ambient texture behind
    // the anecdote (phase 2) — never fully hidden, keeps the beat "alive"
    tl.to("#h3-track-list", { opacity: 0.32, duration: 1.2, ease: "power2.inOut" }, 26.5);
    // and returns to a readable level for the stove-myth debunk close (phase 3)
    tl.to("#h3-track-list", { opacity: 0.55, duration: 1.2, ease: "power2.inOut" }, 48.0);

    // ================= KITCHEN-STOVE MV INSERT (real MV footage, with sound) =================
    tl.fromTo("#h3-kitchen-card", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 0.94, duration: 0.5, ease: "power3.out" }, 48.5);
    tl.to("#h3-kitchen-card", { opacity: 0, duration: 0.4, ease: "power2.in" }, 53.4);

    // gradient-text-sweep emphasis on Prodigy's line, right as the quote lands
    tl.fromTo(
      "#h3-emph-grad",
      { opacity: 0, backgroundPosition: "100% 50%" },
      { opacity: 1, duration: 0.2, ease: "power2.out" },
      39.4
    );
    tl.to("#h3-emph-grad", { backgroundPosition: "0% 50%", duration: 1.1, ease: "none" }, 39.4);

    // ================= CAPTIONS =================
    // -- phase 1: the sample breakdown --
    showCaption(tl, "h3-cap-0", ["h3-cap-0-p0", "h3-cap-0-p1", "h3-cap-0-p2"], 2.4, 6.6);
    showCaption(tl, "h3-cap-1", ["h3-cap-1-p0", "h3-cap-1-p1"], 7.0, 12.6);
    showCaption(tl, "h3-cap-2", ["h3-cap-2-p0", "h3-cap-2-p1"], 12.9, 17.6);
    showCaption(tl, "h3-cap-3", ["h3-cap-3-p0", "h3-cap-3-p1"], 17.9, 22.6);
    showCaption(tl, "h3-cap-4", ["h3-cap-4-p0", "h3-cap-4-p1"], 22.9, 27.0);

    // -- phase 2: the almost-deleted tape --
    showCaption(tl, "h3-cap-5", ["h3-cap-5-p0"], 27.3, 29.5);
    showCaption(tl, "h3-cap-6", ["h3-cap-6-p0", "h3-cap-6-p1", "h3-cap-6-p2"], 29.8, 36.0);
    showCaption(tl, "h3-cap-7", ["h3-cap-7-p0", "h3-cap-7-p1", "h3-cap-7-p2"], 36.3, 43.0);
    showCaption(tl, "h3-cap-8", ["h3-cap-8-p0", "h3-cap-8-p1"], 43.3, 48.0);

    // -- phase 3: the stove myth debunk --
    showCaption(tl, "h3-cap-9", ["h3-cap-9-p0", "h3-cap-9-p1", "h3-cap-9-p2"], 48.3, 55.5);
    showCaption(tl, "h3-cap-10", ["h3-cap-10-p0", "h3-cap-10-p1"], 55.8, 60.0);
    showCaption(tl, "h3-cap-11", ["h3-cap-11-p0", "h3-cap-11-p1"], 60.3, null);

    window.__timelines["03-beat-making"] = tl;
  })();
</script>
