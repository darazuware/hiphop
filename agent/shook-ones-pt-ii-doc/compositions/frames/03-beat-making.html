<script>
  (function () {
    var F = 1 / 60;

    function wf(tl, phraseEls, t0) {
      var t = t0;
      phraseEls.forEach(function (el, i) {
        var isAnchor = i === 0;
        var y = isAnchor ? 64 : 42;
        var dur = isAnchor ? 0.18 : 0.14;
        tl.set(el, { opacity: 1, y: y }, t);
        tl.to(el, { y: 0, duration: dur, ease: "power4.out" }, t);
        t = t + dur - (isAnchor ? F : 2 * F);

    }

    function showCaption(tl, id, phraseIds, enterAt, exitAt) {
      // exitAt === null holds the caption to the end of the scene.
      var wrap = document.getElementById(id);
      var phrases = phraseIds.map(function (pid) { return document.getElementById(pid); });

      }

    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    // ================= HEADLINE =================
    tl.set("#h3-hl-1", { opacity: 1, y: 66 }, 0.15);
    tl.to("#h3-hl-1", { y: 0, duration: 0.2, ease: "power4.out" }, 0.15);
    tl.set("#h3-hl-2", { opacity: 1, y: 56 }, 0.32);
    tl.to("#h3-hl-2", { y: 0, duration: 0.22, ease: "power4.out" }, 0.32);
    // gradient-text-sweep: continuous sweep through "3枚のレコードの重ね技"
    tl.fromTo(
      "#h3-hl-grad",
      { backgroundPosition: "100% 50%" },
      { backgroundPosition: "0% 50%", duration: 2.0, ease: "none" },
      1.1
    );

    // ================= JACKETS: spring-pop-entrance, staggered =================
    tl.fromTo("#h3-jacket-hancock", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" }, 1.0);
    tl.fromTo("#h3-jacket-jones", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" }, 1.5);
    tl.fromTo("#h3-jacket-daly", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" }, 2.0);
    tl.to("#h3-jacket-jones .h3-jacket-tag, #h3-jacket-daly .h3-jacket-tag, #h3-jacket-hancock .h3-jacket-tag",
      { opacity: 1, duration: 0.4, ease: "power2.out", stagger: 0.15 }, 2.6);

    // settle to a smaller resting size once introduced, leaving them lined up
    // (per operator direction) but freeing visual weight for the zoom-in below
    tl.to("#h3-jacket-hancock, #h3-jacket-jones, #h3-jacket-daly",
      { scale: 0.62, duration: 0.5, ease: "power2.inOut" }, 3.2);

    // ================= JACKET RINGS + ZOOM: the jacket currently being explained
    // pops back up to full size (in place — the tag scales up with it) exactly
    // while its own waveform is in the spotlight slot below =================
    tl.fromTo("#h3-ring-hancock", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 7.0);
    tl.to("#h3-jacket-hancock", { scale: 1, duration: 0.35, ease: "power2.out" }, 7.0);
    tl.to("#h3-ring-hancock", { opacity: 0, duration: 0.3, ease: "power2.in" }, 12.3);
    tl.to("#h3-jacket-hancock", { scale: 0.62, duration: 0.35, ease: "power2.in" }, 12.3);
    tl.fromTo("#h3-ring-jones", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 12.9);
    tl.to("#h3-jacket-jones", { scale: 1, duration: 0.35, ease: "power2.out" }, 12.9);
    tl.to("#h3-ring-jones", { opacity: 0, duration: 0.3, ease: "power2.in" }, 17.3);
    tl.to("#h3-jacket-jones", { scale: 0.62, duration: 0.35, ease: "power2.in" }, 17.3);
    tl.fromTo("#h3-ring-daly", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 17.9);
    tl.to("#h3-jacket-daly", { scale: 1, duration: 0.35, ease: "power2.out" }, 17.9);
    tl.to("#h3-ring-daly", { opacity: 0, duration: 0.3, ease: "power2.in" }, 22.3);
    tl.to("#h3-jacket-daly", { scale: 0.62, duration: 0.35, ease: "power2.in" }, 22.3);

    // jackets recede into the background once the sample breakdown is told,
    // making room for the anecdote captions (phase 1 -> phase 2 handoff)
    tl.to("#h3-jacket-cluster", { scale: 0.8, y: -60, opacity: 0.28, duration: 1.0, ease: "power2.inOut" }, 26.5);

    // ================= WAVEFORM STACK =================
    // waterfall-entry: three rows rise/fade in, tight stagger, each settling
    // into its own thin idle slot
    tl.fromTo("#h3-wave-jessica", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power4.out" }, 6.9);
    tl.fromTo("#h3-wave-kitty", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power4.out" }, 7.05);
    tl.fromTo("#h3-wave-dirtyfeet", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power4.out" }, 7.2);

    // spotlight: whichever sample is currently being explained jumps from its
    // thin idle slot to a shared, much taller slot (effective top:0,
    // height:150) and renders above its still-thin siblings, exactly in sync
    // with its own jacket zoom above and its own <audio> window — then drops
    // back. Repositioning uses `y` (transform), not `top` — a lint rule here
    // flags `top`-based motion because it snaps to integer device pixels
    // under HyperFrames' seek-by-frame capture and can stutter; each row's
    // CSS `top` stays fixed at its idle slot and `y` shifts it the rest of
    // the way (kitty/dirtyfeet's idle top is already 26px/52px, so y:-26/-52
    // brings them level with jessica's slot at effective 0).
    // meta labels live outside each row's own graphic (left margin), so they
    // aren't covered by the spotlight row's z-index the way the graphic
    // covers its neighbors — dim the other two labels while one is spotlit
    // so they don't visually collide with the enlarged one's relocated label
    tl.set("#h3-wave-jessica", { zIndex: 5 }, 6.95);
    tl.to("#h3-wave-jessica", { height: 150, duration: 0.35, ease: "power2.out" }, 7.0);
    tl.to("#h3-wave-kitty .h3-wave-meta, #h3-wave-dirtyfeet .h3-wave-meta", { opacity: 0, duration: 0.25 }, 7.0);
    tl.to("#h3-wave-jessica", { height: 18, duration: 0.35, ease: "power2.in" }, 12.3);
    tl.to("#h3-wave-kitty .h3-wave-meta, #h3-wave-dirtyfeet .h3-wave-meta", { opacity: 1, duration: 0.25 }, 12.3);
    tl.set("#h3-wave-jessica", { zIndex: 1 }, 12.7);

    tl.set("#h3-wave-kitty", { zIndex: 5 }, 12.85);
    tl.to("#h3-wave-kitty", { y: -26, height: 150, duration: 0.35, ease: "power2.out" }, 12.9);
    tl.to("#h3-wave-jessica .h3-wave-meta, #h3-wave-dirtyfeet .h3-wave-meta", { opacity: 0, duration: 0.25 }, 12.9);
    tl.to("#h3-wave-kitty", { y: 0, height: 18, duration: 0.35, ease: "power2.in" }, 17.3);
    tl.to("#h3-wave-jessica .h3-wave-meta, #h3-wave-dirtyfeet .h3-wave-meta", { opacity: 1, duration: 0.25 }, 17.3);
    tl.set("#h3-wave-kitty", { zIndex: 1 }, 17.7);

    tl.set("#h3-wave-dirtyfeet", { zIndex: 5 }, 17.85);
    tl.to("#h3-wave-dirtyfeet", { y: -52, height: 150, duration: 0.35, ease: "power2.out" }, 17.9);
    tl.to("#h3-wave-jessica .h3-wave-meta, #h3-wave-kitty .h3-wave-meta", { opacity: 0, duration: 0.25 }, 17.9);
    tl.to("#h3-wave-dirtyfeet", { y: 0, height: 18, duration: 0.35, ease: "power2.in" }, 22.3);
    tl.to("#h3-wave-jessica .h3-wave-meta, #h3-wave-kitty .h3-wave-meta", { opacity: 1, duration: 0.25 }, 22.3);
    tl.set("#h3-wave-dirtyfeet", { zIndex: 1 }, 22.7);

    // gsap-effects audio-visualizer: scrub playback highlight sweeps each row
    // left-to-right in narration order (Jessica piano -> Kitty hats -> Dirty Feet drums)
    /* pixel-width tweens, not percentage — matches the back-to-the-melody/
       hold-you-down recipe. A percentage width tween on this reveal box
       rendered as already-complete on every captured frame under
       HyperFrames' deterministic renderer (verified by sampling render
       output frames a second apart and finding them byte-identical); plain
       pixel widths animate correctly. Each end value is that sample's
       .h3-wave-highlight box width (1400/1300/1300px), which is exactly
       200px/s (1600px over the 8.0s file) times that sample's own audio
       data-duration — so the tween's start time/duration are pinned to
       match the <audio> element's own data-start/data-duration exactly,
       with ease:"none" (linear, like hold-you-down) so the playhead moves
       at constant real-time speed instead of easing ahead of/behind the
       actual sound. Previously this started 2s after its audio and ran on
       an eased, shorter duration — the bar moved but never matched the ear. */
    tl.fromTo("#h3-wave-jessica-reveal", { width: 4 }, { width: 1400, duration: 7.0, ease: "none", immediateRender: false }, 5.5);
    tl.fromTo("#h3-wave-kitty-reveal", { width: 4 }, { width: 1300, duration: 6.5, ease: "none", immediateRender: false }, 10.9);
    tl.fromTo("#h3-wave-dirtyfeet-reveal", { width: 4 }, { width: 1300, duration: 6.5, ease: "none", immediateRender: false }, 15.9);

    // once all three have played, the stack dims to ambient texture behind
    // the anecdote (phase 2) — never fully hidden, keeps the beat "alive"
    tl.to("#h3-wave-stack", { opacity: 0.32, duration: 1.2, ease: "power2.inOut" }, 26.5);
    // and returns to a readable level for the stove-myth debunk close (phase 3)
    tl.to("#h3-wave-stack", { opacity: 0.55, duration: 1.2, ease: "power2.inOut" }, 48.0);

    // ================= KITCHEN-STOVE MV INSERT (real MV footage, with sound) =================
    tl.fromTo("#h3-kitchen-card", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 0.94, duration: 0.5, ease: "power3.out" }, 48.5);
    tl.to("#h3-kitchen-card", { opacity: 0, duration: 0.4, ease: "power2.in" }, 53.4);

    // gradient-text-sweep emphasis on Prodigy's line, right as the quote lands
    tl.fromTo(
      "#h3-emph-grad",
      { opacity: 0, backgroundPosition: "100% 50%" },
      { opacity: 1, duration: 0.2, ease: "power2.out" },
      39.4
    );
    tl.to("#h3-emph-grad", { backgroundPosition: "0% 50%", duration: 1.1, ease: "none" }, 39.4);

    // ================= CAPTIONS =================
    // -- phase 1: the sample breakdown --
    showCaption(tl, "h3-cap-0", ["h3-cap-0-p0", "h3-cap-0-p1", "h3-cap-0-p2"], 2.4, 6.6);
    showCaption(tl, "h3-cap-1", ["h3-cap-1-p0", "h3-cap-1-p1"], 7.0, 12.6);
    showCaption(tl, "h3-cap-2", ["h3-cap-2-p0", "h3-cap-2-p1"], 12.9, 17.6);
    showCaption(tl, "h3-cap-3", ["h3-cap-3-p0", "h3-cap-3-p1"], 17.9, 22.6);
    showCaption(tl, "h3-cap-4", ["h3-cap-4-p0", "h3-cap-4-p1"], 22.9, 27.0);

    // -- phase 2: the almost-deleted tape --
    showCaption(tl, "h3-cap-5", ["h3-cap-5-p0"], 27.3, 29.5);
    showCaption(tl, "h3-cap-6", ["h3-cap-6-p0", "h3-cap-6-p1", "h3-cap-6-p2"], 29.8, 36.0);
    showCaption(tl, "h3-cap-7", ["h3-cap-7-p0", "h3-cap-7-p1", "h3-cap-7-p2"], 36.3, 43.0);
    showCaption(tl, "h3-cap-8", ["h3-cap-8-p0", "h3-cap-8-p1"], 43.3, 48.0);

    // -- phase 3: the stove myth debunk --
    showCaption(tl, "h3-cap-9", ["h3-cap-9-p0", "h3-cap-9-p1", "h3-cap-9-p2"], 48.3, 55.5);
    showCaption(tl, "h3-cap-10", ["h3-cap-10-p0", "h3-cap-10-p1"], 55.8, 60.0);
    showCaption(tl, "h3-cap-11", ["h3-cap-11-p0", "h3-cap-11-p1"], 60.3, null);

    window.__timelines["03-beat-making"] = tl;
  })();
</script>
