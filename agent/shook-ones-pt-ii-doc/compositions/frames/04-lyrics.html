      <script>
        (function () {
          window.__timelines = window.__timelines || {};
          var tl = gsap.timeline({ paused: true });

          var DURATION = 57.5;

          // ---- opening: headline settles in, hero photo already on screen at t=0 ----
          tl.fromTo(
            ".f04-headline-wrap",
            { opacity: 0, y: 26 },
            { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
            0.1,
          );

          // ---- "19歳" marker circle draws in, holds forever after ----
          tl.to(
            "#f04-marker-ring",
            { scale: 1, rotation: -3, duration: 0.6, ease: "back.out(1.7)" },
            0.9,
          );

          // ---- rack focus: photo A (sharp) -> photo B (sharp), mid-scene ----
          var RACK_START = 27.0;
          var RACK_DUR = 1.6;
          var MAX_BLUR = 16;
          var DIM_LEVEL = 0.35;
          tl.set("#f04-photo-b", { "--dof": MAX_BLUR + "px" }, 0);
          tl.to(
            "#f04-photo-a",
            { "--dof": MAX_BLUR + "px", opacity: DIM_LEVEL, duration: RACK_DUR, ease: "power2.inOut" },
            RACK_START,
          );
          tl.to(
            "#f04-photo-b",
            { "--dof": "0px", duration: RACK_DUR, ease: "power2.inOut" },
            RACK_START,
          );

          // ---- captions: waterfall-entry cascade, timed proportionally to text length ----
          var F = 1 / 60;
          function waterfallReveal(container, startTime) {
            var frags = container.querySelectorAll(".f04-frag");
            var t = startTime;
            for (var i = 0; i < frags.length; i++) {
              var isFirst = i === 0;
              var Y = isFirst ? 46 : 40;
              var dur = isFirst ? 0.16 : 0.13;
              var overlapFrames = isFirst ? 1 : 2;
              tl.set(frags[i], { opacity: 1, y: Y }, t);
              tl.to(frags[i], { y: 0, duration: dur, ease: "power4.out" }, t);
              t += dur - overlapFrames * F;
            }
          }

          var chunkEls = Array.prototype.slice.call(document.querySelectorAll(".f04-chunk"));
          var weights = chunkEls.map(function (el) {
            return el.textContent.length;
          });
          var totalWeight = weights.reduce(function (a, b) {
            return a + b;
          }, 0);

          var CAPTION_START = 1.0;
          var CAPTION_END = 54.5;
          var span = CAPTION_END - CAPTION_START;
          var starts = [];
          var acc = CAPTION_START;
          for (var w = 0; w < weights.length; w++) {
            starts.push(acc);
            acc += span * (weights[w] / totalWeight);
          }

          chunkEls.forEach(function (el, i) {
            if (i > 0) {
              tl.to(
                chunkEls[i - 1],
                { opacity: 0, duration: 0.25, ease: "power2.in" },
                starts[i] - 0.25,
              );
            }
            waterfallReveal(el, starts[i]);
          });

          // ---- Pitchfork press screenshot frames in as a supporting visual ----
          var PRESS_AT = starts[5];
          tl.fromTo(
            "#f04-press-frame",
            { opacity: 0, y: 18 },
            { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
            PRESS_AT,
          );
          tl.fromTo(
            "#f04-press-label",
            { opacity: 0 },
            { opacity: 1, duration: 0.4, ease: "power2.out" },
            PRESS_AT + 0.15,
          );

          window.__timelines["04-lyrics"] = tl;
        })();
      </script>
