<template id="song-template">
  <div
    data-composition-id="song"
    data-width="1080"
    data-height="1920"
    data-duration="42"
  >
    <div style="position:absolute;inset:0;background:#000;z-index:0;"></div>
    <audio id="bg-audio" src="../assets/audio.mp3" data-start="0" data-duration="42"></audio>

    <div id="watermark">waxthink.com</div>

    <!-- INTRO (0–2.3s) -->
    <div class="block" id="bintro">
      <div class="intro-artist">NAS</div>
      <div class="intro-rule" id="intro-rule"></div>
      <div class="intro-title">I Can</div>
      <div class="intro-meta">2002&#160;&#160;·&#160;&#160;SALAAM REMI</div>
    </div>

    <!-- Block 1: VTT 37.51 - 37 = 0.51s -->
    <div class="block" id="b1">
      <div class="en">Be – b-boys and girls, listen up</div>
      <div class="sep"></div>
      <div class="jp">Bボーイズ、ガールズ、よく聞け</div>
    </div>

    <!-- Block 2: VTT 39.977 - 37 = 2.97s -->
    <div class="block" id="b2">
      <div class="en">You can be anything in the world, in God we trust</div>
      <div class="sep"></div>
      <div class="jp">神を信じれば<br>この世界で何にでもなれる</div>
    </div>

    <!-- Block 3: VTT 42.744 - 37 = 5.74s -->
    <div class="block" id="b3">
      <div class="en">An architect, doctor, maybe an actress</div>
      <div class="sep"></div>
      <div class="jp">建築家、医者、<br>女優だって目指せる</div>
    </div>

    <!-- Block 4: VTT 45.219 - 37 = 8.21s -->
    <div class="block" id="b4">
      <div class="en">But nothing comes easy, it takes much practice</div>
      <div class="sep"></div>
      <div class="jp">でも何事も楽じゃない、<br>たくさんの練習が要る</div>
    </div>

    <!-- Block 5: VTT 47.619 - 37 = 10.61s -->
    <div class="block" id="b5">
      <div class="en">Like, I met a woman who's becoming a star</div>
      <div class="sep"></div>
      <div class="jp">スターになりかけの<br>女と出会ったことがある</div>
    </div>

    <!-- Block 6: VTT 49.939 - 37 = 12.93s -->
    <div class="block" id="b6">
      <div class="en">She was very beautiful, leaving people in awe</div>
      <div class="sep"></div>
      <div class="jp">とても美しく、<br>周りの人を魅了していた</div>
    </div>

    <!-- Block 7: VTT 52.561 - 37 = 15.56s -->
    <div class="block" id="b7">
      <div class="en">Singing songs, Lena Horne, but the younger version</div>
      <div class="sep"></div>
      <div class="jp">リナ・ホーンのように歌う<br>若き日の彼女</div>
    </div>

    <!-- Block 8: VTT 55.115 - 37 = 18.11s -->
    <div class="block" id="b8">
      <div class="en">Hung with the wrong person,<br>got her strung on that heroin</div>
      <div class="sep"></div>
      <div class="jp">悪い人間と付き合い<br>ヘロイン中毒になってしまった</div>
    </div>

    <!-- Block 9: VTT 58.643 - 37 = 21.64s -->
    <div class="block" id="b9">
      <div class="en">Cocaine, sniffin' up drugs, all in her nose</div>
      <div class="sep"></div>
      <div class="jp">コカイン、ドラッグを吸い込み<br>鼻の奥まで</div>
    </div>

    <!-- Block 10: VTT 60.096 - 37 = 23.09s -->
    <div class="block" id="b10">
      <div class="en">Could've died, so young,<br>now looks ugly and old</div>
      <div class="sep"></div>
      <div class="jp">若くして死にかけ、<br>今は老けて見る影もない</div>
    </div>

    <!-- CTA (最後の歌詞後) -->
    <div class="block" id="bcta">
      <div class="bcta-rule"></div>
      <div class="bcta-brand">WAX&amp;THINK</div>
      <div class="bcta-url">waxthink.com</div>
    </div>

    <!-- Persistent metadata (always visible, center-bottom) -->
    <div id="meta-bar">
      <div class="meta-artist">NAS</div>
      <div class="meta-title-group">
        <div class="meta-title">I Can</div>
        <div class="meta-rule"></div>
      </div>
      <div class="meta-info">2002&#160;&#160;·&#160;&#160;SALAAM REMI</div>
    </div>

    <!-- Full-screen fadeout overlay -->
    <div id="fadeout" style="position:absolute;inset:0;background:#000;opacity:0;z-index:20;pointer-events:none;"></div>

    <style>
      [data-composition-id="song"] {
        background: #000;
        font-family: 'Inter', sans-serif;
        color: #fff;
        overflow: hidden;
      }

      .intro-artist {
        font-size: 200px;
        font-weight: 900;
        letter-spacing: -0.04em;
        line-height: 1;
        color: #fff;
      }
      .intro-rule {
        width: 0;
        height: 3px;
        background: #c8a96b;
        margin: 32px 0 28px;
      }
      .intro-title {
        font-size: 54px;
        font-weight: 400;
        color: #999;
      }
      .intro-meta {
        font-size: 22px;
        letter-spacing: 0.22em;
        color: #444;
        margin-top: 18px;
        text-transform: uppercase;
      }

      #watermark {
        position: absolute;
        bottom: 90px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 22px;
        font-weight: 700;
        color: #333;
        letter-spacing: 0.05em;
        z-index: 10;
      }

      #meta-bar {
        position: absolute;
        bottom: 210px;
        left: 0;
        right: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        z-index: 10;
      }
      .meta-artist {
        font-size: 36px;
        font-weight: 900;
        color: #fff;
        letter-spacing: -0.02em;
        line-height: 1;
      }
      .meta-title {
        font-size: 34px;
        font-weight: 400;
        color: #888;
        letter-spacing: 0.02em;
        margin-top: 5px;
        white-space: nowrap;
      }
      .meta-title-group {
        display: inline-block;
      }
      .meta-rule {
        width: 100%;
        height: 2px;
        background: #c8a96b;
        margin: 10px 0;
      }
      .meta-info {
        font-size: 24px;
        font-weight: 400;
        color: #444;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .block {
        position: absolute;
        top: 50%;
        left: 90px;
        right: 90px;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        opacity: 0;
      }

      /* bintro uses explicit top so GSAP can animate scale/y freely */
      #bintro {
        top: 770px;
        transform: none;
      }

      .en {
        font-size: 72px;
        font-weight: 900;
        color: #fff;
        line-height: 1.08;
        letter-spacing: -0.02em;
      }
      .sep {
        width: 48px;
        height: 2px;
        background: #c8a96b;
        margin: 24px 0;
        flex-shrink: 0;
      }
      .jp {
        font-family: 'Noto Sans JP', sans-serif;
        font-size: 46px;
        font-weight: 700;
        color: #c8a96b;
        line-height: 1.45;
      }

      #bcta { z-index: 25; align-items: center; }
      .bcta-rule { width: 48px; height: 2px; background: #c8a96b; margin-bottom: 32px; }
      .bcta-brand { font-size: 120px; font-weight: 900; color: #fff; letter-spacing: -0.04em; line-height: 1; }
      .bcta-url { font-size: 26px; font-weight: 400; color: #555; letter-spacing: 0.18em; margin-top: 20px; }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      const tl = gsap.timeline({ paused: true });

      tl.set(".block", { opacity: 0 }, 0);
      tl.set(".intro-rule", { width: 0 }, 0);
      tl.set("#meta-bar", { opacity: 0 }, 0);

      // ── Intro (0–2.3s) ───────────────────────────────────────
      tl.fromTo("#bintro",
        { opacity: 0, scale: 0.95, transformOrigin: "center top" },
        { opacity: 1, scale: 1, duration: 0.6, ease: "expo.out" }, 0.1);
      tl.to(".intro-rule", { width: 120, duration: 0.5, ease: "expo.out" }, 0.5);

      // ── Shrink + move to bottom-center (2.0–2.7s) ────────────
      tl.to("#bintro", {
        scale: 0.13,
        y: 1000,
        transformOrigin: "center top",
        duration: 0.7,
        ease: "expo.in"
      }, 2.0);
      tl.to("#bintro", { opacity: 0, duration: 0.3, ease: "power2.in" }, 2.5);
      tl.set("#bintro", { opacity: 0 }, 2.8);

      tl.fromTo("#meta-bar",
        { opacity: 0 },
        { opacity: 1, duration: 0.4, ease: "power2.out" }, 2.5);

      // ── Lyric blocks ─────────────────────────────────────────
      // タイミング = VTT秒 - VERSE_START（ffmpegの-ssオフセット）
      // 例: VTTが20.3sでVERSE_START=18なら → show("#b1", 2.3, 次の行のVTT-18)
      function show(id, t, t2) {
        tl.fromTo(id,
          { opacity: 0, y: 20 },
          { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, t);
        if (t2) {
          tl.to(id, { opacity: 0, duration: 0.2, ease: "power2.in" }, t2 - 0.2);
          tl.set(id, { opacity: 0 }, t2);
        }
      }

      // VTT timestamps minus VERSE_START=37
      show("#b1",  0.51,  2.97);
      show("#b2",  2.97,  5.74);
      show("#b3",  5.74,  8.21);
      show("#b4",  8.21, 10.61);
      show("#b5", 10.61, 12.93);
      show("#b6", 12.93, 15.56);
      show("#b7", 15.56, 18.11);
      show("#b8", 18.11, 21.64);
      show("#b9", 21.64, 23.09);
      // 最後の歌詞: 23.09sフェードイン → 35.0sからゆっくりフェードアウト(→37.5sで消える)
      tl.fromTo('#b10', { opacity: 0 }, { opacity: 1, duration: 0.3, ease: 'power2.out' }, 23.09);
      tl.to('#b10', { opacity: 0, duration: 2.5, ease: 'power2.in' }, 35.0);

      // CTA
      const LAST_LYRIC_END = 27.0;
      tl.fromTo("#bcta",
        { opacity: 0 },
        { opacity: 1, duration: 0.8, ease: "power1.out" }, 38.5);

      // Fadeout (39.0s → 42s)
      tl.to("#fadeout", { opacity: 1, duration: 1.2, ease: "power2.in" }, 37.5);
      tl.set("#fadeout", { opacity: 1 }, 42);

      window.__timelines = window.__timelines || {};
      window.__timelines["song"] = tl;
    </script>
  </div>
</template>
